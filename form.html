<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/form.css">

<body>
    <div class="face">
        <p class="text01">• FORMULARIO OFICIAL DE INSCRIÇÃO</p>
        <h1> GARANTA A SUA

        </h1>

    </div>

    <section class="conteiner">
        <form class="box-conteiner">
            <h1>1. DADOS PESSOAIS E CONTATO</h1>
            <h2>QUAL O SEU VINCULO COM A ESCOLA</h2>

            <label class="checklistAluno">
                <input type="radio" name="vinculo">ALUNO
            </label>

            <label class="checklistAluno">
                <input type="radio" name="vinculo"> EX ALUNO
            </label>

            <label class="checklistAluno">
                <input type="radio" name="vinculo"> SEM VINCULO
            </label>

            <div class="checkdata">
                <label for="" class="checklistNome">NOME COMPLETO <br>
                    <input class="campoNome" type="text">
                </label>
                <label for="">EMAIL <br>
                    <input class="campoemail" type="text">
                </label>
            </div>
        </form>
    </section>
    <script src="js/index.js"></script>

</html>
